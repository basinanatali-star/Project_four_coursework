{% extends 'base.html' %}

{% block title %}Восстановление пароля — MailingList{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Восстановление пароля</h2>

                    <p>
                        Укажите Email, который использовали при регистрации.
                        Мы отправим вам ссылку для восстановления пароля.
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary w-100">
                            Отправить ссылку
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
