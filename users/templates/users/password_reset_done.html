{% extends 'base.html' %}

{% block title %}Письмо отправлено — MailingList{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <h2 class="mb-3">Проверьте почту</h2>

                    <p>
                        Если указанный Email зарегистрирован и аккаунт активен,
                        мы отправили на него письмо со ссылкой для восстановления пароля.
                    </p>

                    <a href="{% url 'users:login' %}" class="btn btn-primary">
                        Вернуться ко входу
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
