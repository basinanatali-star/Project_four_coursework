{% load static %}

<header>
    <div class="container-fluid px-3 px-md-4 py-3 mb-3 bg-white border-bottom shadow-sm">

        <div class="d-flex flex-column flex-lg-row align-items-center gap-3">

            <!-- Логотип -->
            <a href="/"
               class="d-flex align-items-center text-decoration-none me-lg-auto">

                <h4 class="my-0 fw-semibold text-primary">
                    MailingList
                </h4>

            </a>

            <!-- Навигация -->
            <nav class="d-flex flex-wrap justify-content-center gap-2">

                <a class="btn btn-outline-primary rounded-3 px-3"
                   href="/">
                    Главная
                </a>

                <a class="btn btn-outline-primary rounded-3 px-3"
                   href="{% url 'service:clients_list' %}">
                    Мои клиенты
                </a>

                <a class="btn btn-outline-primary rounded-3 px-3"
                   href="{% url 'service:mailings_list' %}">
                    Мои рассылки
                </a>

                <a class="btn btn-outline-primary rounded-3 px-3"
                   href="{% url 'service:messages_list' %}">
                    Сообщения
                </a>

                {% if user.is_authenticated %}

                    <form method="post"
                          action="{% url 'users:logout' %}"
                          class="m-0">

                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-outline-danger rounded-3 px-3">
                            Выход
                        </button>

                    </form>

                {% else %}

                    <a class="btn btn-outline-primary rounded-3 px-3"
                       href="{% url 'users:register' %}">
                        Регистрация
                    </a>

                    <a class="btn btn-primary rounded-3 px-3"
                       href="{% url 'users:login' %}">
                        Войти
                    </a>

                {% endif %}

            </nav>

        </div>
    </div>
</header>
