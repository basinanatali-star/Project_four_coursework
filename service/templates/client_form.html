{% extends 'base.html' %}
{% block title %}MailingList{% endblock %}

{% block content %}

<div class="modal fade" id="exampleModal3" tabindex="-1" aria-labelledby="exampleModalLabel3" aria-hidden="true">
  <div class="modal-dialog">

      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel3">Регистрация</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">

        <form id=register class="p-4 p-md-5 border rounded-3  bg-light"  method="post" enctype="multipart/form-data"
              onsubmit="return false;">

                      <center>
<br><br>
<style>
a {
    color:#007bff;
}
</style>
        <h1 class="h3 mb-3 fw-normal">Пожалуйста, зарегистрируйтесь</h1></center>
          <div class="form-floating mb-3">

          </div>
          <div class="form-floating mb-3">
            <input type="password" name ="password" class="form-control" id="floatingPassword" placeholder="Пароль">

          </div>
            <div class="form-floating mb-3">
            <input type="password" name ="password2" class="form-control" id="floatingPassword" placeholder="Повторите пароль">

            </div>

          <button style="width:100%" class="buttblue" id="checkAllTopicCheckBoxes2">регистрация</button>
          <hr class="my-4">

           <a data-bs-toggle="modal" data-bs-target="#exampleModal2" href="#">Вход в систему</a>

      </div>
</div>
      </div>
    </div>
{% endblock %}
